version: '3.8'

services:
  spamshield:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3001}
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-spamcapture}
      - DB_USER=${DB_USER:-spamshield}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - INTELLIGENCE_REFRESH_INTERVAL=${INTELLIGENCE_REFRESH_INTERVAL:-*/5 * * * *}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - spamshield-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-spamcapture}
      - POSTGRES_USER=${DB_USER:-spamshield}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-spamshield-schema.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    networks:
      - spamshield-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - spamshield-network

volumes:
  postgres-data:
  redis-data:

networks:
  spamshield-network:
    driver: bridge